# 原生接缝安全门禁：对上游桥不变量做「快照 vs golden」校验，并作为发版前硬闸。
#
# 两种入口共用同一套检查：
#   1. workflow_call：由 autonomous-release 传入 build job 解析出的同一 $TAG 调用；
#      任一门禁失败即返回非零，阻塞后续 sign-publish，构成发版硬闸。这道闸的职责是
#      「对即将发布的那个 tag 做二次校验并阻塞发版」。
#   2. 巡检入口（schedule 每日 / pull_request / push:main / workflow_dispatch）：
#      对上游最新 release tag 跑同一套检查，作为独立告警，不与发版职责混淆。
#
# 安全模型：permissions 仅 contents: read，无 Secret；两处 checkout 均为
# persist-credentials: false；全程只读检查，不改源码、不构建、不签名。
# 完整编译与签名仍由 autonomous-release 完成。
name: seam-security

on:
  workflow_call:
    inputs:
      upstream_tag:
        description: "上游 tag（v*）；调用方必须传入以保证与发版同一 ref"
        required: true
        type: string
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "上游 tag（如 v1.2.0）；留空取上游最新 release tag"
        required: false

permissions:
  contents: read

concurrency:
  group: seam-security-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: ccch1mneyyy/dsh-Go
  NODE_VERSION: 24.22.1

jobs:
  seam-gate:
    name: 接缝安全门禁
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出本仓库（golden 基线 + 门禁脚本）
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: self

      - name: 解析上游 tag（与发版链同语义）
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.upstream_tag || github.event.inputs.upstream_tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name)
          fi
          case "$TAG" in v*) ;; *) echo "tag 不属于 dsh-Go 版本格式: $TAG"; exit 1;; esac
          echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          echo "被检上游 tag: $TAG"

      - name: 检出上游源码（与发版同一 tag）
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false
          path: upstream

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 门禁 1/3：接缝安全快照 vs golden（防安全放松）
        run: python3 self/scripts/check_seam_security.py upstream

      - name: 门禁 2/3：锚点预算（防新增功能专用补丁）
        run: python3 self/scripts/check_anchor_budget.py

      - name: 门禁 3/3：门禁自测（变异测试，防门禁自身失效）
        # 上游结构变化使源探针失效时此步变红：先修正门禁逻辑，再评估 golden 基线。
        env:
          DSH_UPSTREAM_SRC: upstream
        run: |
          set -euo pipefail
          python3 -m unittest discover -s self/tests -p 'test_seam_security_gate.py' -v
          python3 -m unittest discover -s self/tests -p 'test_anchor_budget_gate.py' -v

      - name: 汇总
        if: always()
        run: echo "接缝安全门禁执行完毕（详情见各步骤日志）。"
