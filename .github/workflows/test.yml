name: keystore-diagnose
on: workflow_dispatch
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: 恢复 keystore 并诊断
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p keys && umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > keys/release.jks
          echo "=== 文件指纹 ==="
          sha256sum keys/release.jks
          echo "=== 文件头(30 82=PKCS12 / fe ed=JKS) ==="
          head -c 2 keys/release.jks | xxd
          echo "=== 密码长度(只看长度,不显示内容) ==="
          echo ${#STORE_PASSWORD}
          echo "=== keytool 打开测试 ==="
          keytool -list -keystore keys/release.jks -storepass "$STORE_PASSWORD" 2>&1 || echo "KEYTOOL_FAILED"
          echo "=== JDK 版本 ==="
          java -version 2>&1
